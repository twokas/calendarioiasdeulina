<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useMemo } = React;

function Icon({ size = 16, children, spin }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
      style={spin ? { animation: "cp-spin 1s linear infinite" } : undefined}>
      {children}
    </svg>
  );
}
const Lock = (p) => <Icon {...p}><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Icon>;
const LogOut = (p) => <Icon {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></Icon>;
const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
const Pencil = (p) => <Icon {...p}><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></Icon>;
const Trash2 = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></Icon>;
const Music2 = (p) => <Icon {...p}><circle cx="8" cy="18" r="3"/><path d="M11 18V4l9-1v13"/><circle cx="17" cy="16" r="3"/></Icon>;
const Copy = (p) => <Icon {...p}><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></Icon>;
const Check = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12"/></Icon>;
const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
const ChevronDown = (p) => <Icon {...p}><polyline points="6 9 12 15 18 9"/></Icon>;
const ChevronUp = (p) => <Icon {...p}><polyline points="18 15 12 9 6 15"/></Icon>;
const ChevronLeft = (p) => <Icon {...p}><polyline points="15 18 9 12 15 6"/></Icon>;
const ChevronRight = (p) => <Icon {...p}><polyline points="9 18 15 12 9 6"/></Icon>;
const Loader2 = (p) => <Icon {...p} spin><path d="M21 12a9 9 0 1 1-6.219-8.56"/></Icon>;

const API_URL = window.APP_CONFIG.APPS_SCRIPT_URL;
const GOOGLE_CLIENT_ID = window.APP_CONFIG.GOOGLE_CLIENT_ID;

const WEEKDAY_SHORT = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
const WEEKDAY_FULL = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
const HIGHLIGHT_DOWS = [0, 3, 6];
const DOW_BASE = { 0: "var(--gold)", 3: "var(--sage)", 6: "var(--ember)" };
const DOW_SOFT = { 0: "var(--gold-soft)", 3: "var(--sage-soft)", 6: "var(--ember-soft)" };
const DOW_TINT = { 0: "rgba(201,154,62,0.22)", 3: "rgba(75,100,85,0.32)", 6: "rgba(162,73,54,0.22)" };

// Horário padrão sugerido por dia da semana (o usuário sempre pode trocar na hora).
const DEFAULT_TIMES = { 0: "19:00", 1: "12:00", 2: "12:00", 3: "20:00", 4: "12:00", 5: "12:00", 6: "09:00" };

function dowColor(dow, dark) {
  const map = dark ? DOW_SOFT : DOW_BASE;
  return map[dow] || (dark ? "var(--muted)" : "var(--ember)");
}

function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function pad2(n) { return String(n).padStart(2, "0"); }

function formatWeekday(iso) {
  if (!iso) return "";
  return capitalize(new Date(iso + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "long" }));
}
function formatDateLong(iso) {
  if (!iso) return "";
  return new Date(iso + "T12:00:00").toLocaleDateString("pt-BR", { day: "numeric", month: "long", year: "numeric" });
}
function formatDateShort(iso) {
  if (!iso) return { day: "--", month: "---", dow: null };
  const d = new Date(iso + "T12:00:00");
  const day = d.toLocaleDateString("pt-BR", { day: "2-digit" });
  const month = d.toLocaleDateString("pt-BR", { month: "short" }).replace(".", "").toUpperCase();
  return { day, month, dow: d.getDay() };
}
function todayIso() { return new Date().toISOString().slice(0, 10); }

function getMonthMatrix(year, month) {
  const firstDay = new Date(year, month, 1);
  const startDow = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ iso: `${year}-${pad2(month + 1)}-${pad2(d)}`, day: d, dow: (startDow + d - 1) % 7 });
  }
  while (cells.length % 7 !== 0) cells.push(null);
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  return weeks;
}

function compareEntries(a, b) {
  if (a.date !== b.date) return a.date < b.date ? -1 : 1;
  const at = a.time || "99:99";
  const bt = b.time || "99:99";
  if (at !== bt) return at < bt ? -1 : 1;
  return 0;
}

function makeId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function defaultTimeFor(iso) {
  if (!iso) return "";
  return DEFAULT_TIMES[new Date(iso + "T12:00:00").getDay()] || "";
}

// Decodifica só a parte visível do JWT (nome/e-mail) para exibir na tela.
// A verificação de verdade (assinatura) acontece no servidor (Apps Script).
function decodeJwt(token) {
  try {
    return JSON.parse(atob(token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
  } catch (e) {
    return null;
  }
}

async function apiGet(action) {
  const res = await fetch(`${API_URL}?action=${action}`);
  return res.json();
}

async function apiPost(body) {
  const res = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify(body),
  });
  return res.json();
}

function App() {
  const [ready, setReady] = useState(false);
  const [entries, setEntries] = useState([]);

  const [saving, setSaving] = useState(false);

  const [showPast /* unused, past events removed */] = useState(false);
  const [showThisMonth, setShowThisMonth] = useState(false);
  const [showFutureMonths, setShowFutureMonths] = useState(false);
  const [openMonths, setOpenMonths] = useState({});

  const [editingEntry, setEditingEntry] = useState(null);
  const [viewingEntry, setViewingEntry] = useState(null);
  const [dayView, setDayView] = useState(null);
  const [toast, setToast] = useState("");
  const [saveError, setSaveError] = useState("");

  const [multiMode, setMultiMode] = useState(false);
  const [multiDates, setMultiDates] = useState([]);
  const [rangeStart, setRangeStart] = useState("");
  const [rangeEnd, setRangeEnd] = useState("");
  const [dateInput, setDateInput] = useState("");

  const [calMonth, setCalMonth] = useState(() => {
    const d = new Date();
    return { year: d.getFullYear(), month: d.getMonth() };
  });

  const googleBtnRef = React.useRef(null);

  // --- Carregar dados ---
  const loadEntries = useCallback(async () => {
    try {
      const data = await apiGet("entries");
      if (data.entries) setEntries(data.entries);
      else if (data.error) showToast("Erro ao carregar: " + data.error);
    } catch (e) {
      showToast("Não foi possível conectar ao servidor de dados.");
    }
  }, []);

  useEffect(() => {
    (async () => {
      await loadEntries();
      setReady(true);
      // restaura sessão do Google salva neste navegador
      const saved = sessionStorage.getItem("cp-user");
      if (saved) {
        try { setCurrentUser(JSON.parse(saved)); } catch (e) {}
      }
    })();
  }, [loadEntries]);

  // --- Login com Google ---
  useEffect(() => {
    if (!window.google || !googleBtnRef.current || currentUser) return;
    window.google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: (response) => {
        const payload = decodeJwt(response.credential);
        if (!payload) return;
        const user = { name: payload.name || payload.email, email: payload.email, idToken: response.credential };
        setCurrentUser(user);
        sessionStorage.setItem("cp-user", JSON.stringify(user));
        showToast(`Bem-vindo(a), ${user.name.split(" ")[0]}.`);
      },
    });
    window.google.accounts.id.renderButton(googleBtnRef.current, { theme: "filled_black", size: "medium", shape: "pill", text: "signin_with" });
  }, [currentUser, ready]);

  function handleLogout() {
    setCurrentUser(null);
    sessionStorage.removeItem("cp-user");
    if (window.google) window.google.accounts.id.disableAutoSelect();
    showToast("Sessão encerrada.");
  }

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(""), 2600);
  }, []);

  const sortedEntries = useMemo(() => [...entries].sort(compareEntries), [entries]);
  const entriesByDate = useMemo(() => {
    const map = {};
    sortedEntries.forEach((e) => { (map[e.date] = map[e.date] || []).push(e); });
    return map;
  }, [sortedEntries]);

  // --- Salvar / apagar (via backend) ---
  async function withAuthPost(body) {
    if (!currentUser) { showToast("Faça login para editar."); return { error: "not-authenticated" }; }
    setSaving(true);
    try {
      const res = await apiPost({ ...body, idToken: currentUser.idToken });
      if (res.error) {
        if (String(res.error).toLowerCase().includes("token")) {
          showToast("Sessão expirada — faça login novamente.");
          handleLogout();
        } else {
          showToast(res.error);
        }
        return res;
      }
      await loadEntries();
      return res;
    } catch (e) {
      showToast("Erro de conexão ao salvar.");
      return { error: String(e) };
    } finally {
      setSaving(false);
    }
  }

  function resetMultiDateState() {
    setMultiMode(false); setMultiDates([]); setRangeStart(""); setRangeEnd(""); setDateInput("");
  }

  function openNewEntry(presetDate) {
    setSaveError("");
    resetMultiDateState();
    setEditingEntry({
      id: null, date: presetDate || "", time: defaultTimeFor(presetDate),
      preacher: "", speaker: "", theme: "", summary: "", hymnOpening: "", hymnClosing: "",
    });
  }
  function openEditEntry(entry) { setSaveError(""); resetMultiDateState(); setEditingEntry({ ...entry }); }
  function closeEntryModal() { setEditingEntry(null); setSaveError(""); resetMultiDateState(); }

  function dateRange(startIso, endIso) {
    if (!startIso || !endIso) return [];
    let d1 = new Date(startIso + "T12:00:00"), d2 = new Date(endIso + "T12:00:00");
    if (d1 > d2) [d1, d2] = [d2, d1];
    const list = [];
    const cur = new Date(d1);
    while (cur <= d2) { list.push(cur.toISOString().slice(0, 10)); cur.setDate(cur.getDate() + 1); }
    return list;
  }
  function addRangeDates() {
    const list = dateRange(rangeStart, rangeEnd);
    if (list.length === 0) return;
    setMultiDates((prev) => Array.from(new Set([...prev, ...list])).sort());
    setRangeStart(""); setRangeEnd("");
  }
  function addSingleMultiDate() {
    if (!dateInput) return;
    setMultiDates((prev) => (prev.includes(dateInput) ? prev : [...prev, dateInput].sort()));
    setDateInput("");
  }
  function removeMultiDate(d) { setMultiDates((prev) => prev.filter((x) => x !== d)); }

  function handleDayClick(iso) {
    const dayEntries = entriesByDate[iso] || [];
    if (dayEntries.length === 0) { if (currentUser) openNewEntry(iso); return; }
    if (dayEntries.length === 1) {
      if (currentUser) openEditEntry(dayEntries[0]); else setViewingEntry(dayEntries[0]);
      return;
    }
    setDayView(iso);
  }

  async function saveEntry(e) {
    e.preventDefault();
    if (!editingEntry.preacher.trim()) { setSaveError("Preencha o nome do responsável."); return; }

    if (multiMode && !editingEntry.id) {
      if (multiDates.length === 0) { setSaveError("Adicione ao menos uma data."); return; }
      const base = {
        time: editingEntry.time, preacher: editingEntry.preacher, speaker: editingEntry.speaker,
        theme: editingEntry.theme, summary: editingEntry.summary,
        hymnOpening: editingEntry.hymnOpening, hymnClosing: editingEntry.hymnClosing,
      };
      const newEntries = multiDates.map((d) => ({ ...base, id: makeId(), date: d }));
      const res = await withAuthPost({ action: "saveEntries", entries: newEntries });
      if (!res.error) { closeEntryModal(); showToast(`${newEntries.length} eventos salvos.`); }
      return;
    }

    if (!editingEntry.date) { setSaveError("Preencha a data."); return; }
    const entry = editingEntry.id ? editingEntry : { ...editingEntry, id: makeId() };
    const res = await withAuthPost({ action: "saveEntry", entry });
    if (!res.error) { closeEntryModal(); showToast("Evento salvo."); }
  }

  async function deleteEntry(id) {
    if (!window.confirm("Remover este evento do calendário?")) return;
    const res = await withAuthPost({ action: "deleteEntry", id });
    if (!res.error) showToast("Removido.");
  }

  function copySummary(entry) {
    const parts = [
      `${formatWeekday(entry.date)}, ${formatDateLong(entry.date)}`,
      entry.time ? `Horário: ${entry.time}` : null,
      entry.preacher ? `Ancião/ Depto responsável: ${entry.preacher}` : null,
      entry.speaker ? `Pregador(a): ${entry.speaker}` : null,
      entry.theme ? `Tema: ${entry.theme}` : null,
      entry.summary ? `\n${entry.summary}` : null,
      entry.hymnOpening ? `\nHino inicial: ${entry.hymnOpening}` : null,
      entry.hymnClosing ? `Hino final: ${entry.hymnClosing}` : null,
    ].filter(Boolean);
    navigator.clipboard.writeText(parts.join("\n"))
      .then(() => showToast("Resumo copiado para a área de transferência."))
      .catch(() => showToast("Não foi possível copiar."));
  }

  const today = todayIso();
  const upcoming = sortedEntries.filter((e) => e.date >= today);
  const heroDate = upcoming[0] && upcoming[0].date;
  const heroEntries = heroDate ? upcoming.filter((e) => e.date === heroDate) : [];
  const restUpcoming = upcoming.filter((e) => e.date !== heroDate);

  const todayDateObj = new Date();
  const currentMonthKey = `${todayDateObj.getFullYear()}-${pad2(todayDateObj.getMonth() + 1)}`;
  const upcomingByMonth = useMemo(() => {
    const map = {};
    restUpcoming.forEach((e) => { const k = e.date.slice(0, 7); (map[k] = map[k] || []).push(e); });
    return map;
  }, [restUpcoming]);
  const thisMonthEvents = upcomingByMonth[currentMonthKey] || [];
  const futureMonthKeys = Object.keys(upcomingByMonth).filter((k) => k !== currentMonthKey).sort();

  function monthLabelFor(key) {
    const [y, m] = key.split("-").map(Number);
    const label = capitalize(new Date(y, m - 1, 1).toLocaleDateString("pt-BR", { month: "long" }));
    return y !== todayDateObj.getFullYear() ? `${label} de ${y}` : label;
  }
  function toggleMonth(key) { setOpenMonths((prev) => ({ ...prev, [key]: !prev[key] })); }

  const monthLabel = capitalize(new Date(calMonth.year, calMonth.month, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" }));
  const weeks = useMemo(() => getMonthMatrix(calMonth.year, calMonth.month), [calMonth]);
  function goMonth(delta) { setCalMonth((c) => { const d = new Date(c.year, c.month + delta, 1); return { year: d.getFullYear(), month: d.getMonth() }; }); }
  function goToday() { const d = new Date(); setCalMonth({ year: d.getFullYear(), month: d.getMonth() }); }

  return (
    <div id="root">
      <header className="cp-header">
        <div style={{ display: "flex", gap: 0, alignItems: "center" }}>
          <svg viewBox="0 0 1920 1080" className="cp-logo" xmlns="http://www.w3.org/2000/svg" aria-label="Logo IASD">
            <path d="M1054.95,769.91c-46.87-7.91-72.43,14.4-80.08,35.3-.68,1.85-2.87,1.57-2.87-.2l-.02-6.5c0-23.34,20.8-44.69,45.57-69.46l40.93-40.96,109.05,18.76s31.15,31.15,57.78,57.81c51.36-60.59,82.36-139,82.36-224.65,0-192.01-155.65-347.66-347.66-347.66s-347.66,155.65-347.66,347.66c0,85.66,30.99,164.06,82.35,224.65,26.64-26.66,57.78-57.81,57.78-57.81l123.78-21.27c57.32-9.98,71.63,2.92,71.72,21.9,0,.82-.67,1.49-1.49,1.49h-35.74c-.82,0-1.49.66-1.49,1.48v21.13c0,.82.67,1.49,1.49,1.49h35.77c.82,0,1.49.67,1.49,1.49,0,0,0,69.19,0,70.46,0,1.76-2.2,2.04-2.87.2-7.65-20.9-33.2-43.21-80.08-35.3,0,0-81.51,14.09-141.97,24.5,62.09,57.85,145.36,93.26,236.92,93.26s174.83-35.41,236.92-93.26c-60.46-10.41-141.97-24.5-141.97-24.5ZM974.97,770.92c-.46,2.22-3,2.21-3,0v-36.36c0-.82.67-1.49,1.49-1.49h18.01c-8.01,10.58-13.14,21.49-16.51,37.85ZM1104.27,543.81c8.71,28.15,3.02,71.32-37.78,112.12l-49,49.04c-1.37,1.37-2.7,2.7-3.99,3.99h-33.73c8.26-14.18,22.23-28.38,37.78-43.92l34.15-34.12c43.18-43.18,49.98-63.5,49.78-87.16-.02-2.51,2.05-2.35,2.79.04ZM1037.48,517.09c27.91-27.91,34.64-60.24,12.45-79.47-1.86-1.61-.89-3.58,1.54-2.47,27.67,12.61,49.49,58.43,2.05,105.88l-36.04,35.96c-24.51,24.51-36.37,36.18-42.49,65.9-.46,2.22-3,2.21-3,0v-36.41c0-23.34,20.8-44.69,45.57-69.46l19.92-19.92ZM815.91,549.85c-8.71-28.15-3.02-71.32,37.78-112.12l107.92-107.97c24.51-24.51,36.39-36.23,42.52-65.95.46-2.22,3-2.21,3,0v36.41c0,23.34-20.8,44.69-45.57,69.46l-93.08,93.05c-43.18,43.18-49.98,63.5-49.78,87.16.02,2.51-2.05,2.35-2.79-.04ZM832.46,614.17c-24.13-29.5-15.92-75.42,31.52-122.86l97.76-97.67c24.51-24.51,36.36-36.42,42.49-66.13.46-2.22,3-2.21,3,0v36.66c0,23.34-20.8,44.69-45.57,69.46l-86.38,86.38c-18.21,18.21-56.47,56.48-40.51,92.58,1.05,2.37-.68,3.55-2.29,1.58ZM882.69,576.57c-27.91,27.91-34.64,60.24-12.45,79.47,1.86,1.61.89,3.58-1.54,2.47-27.67-12.61-49.49-58.43-2.04-105.88l94.97-94.89c24.51-24.51,36.37-36.18,42.49-65.9.46-2.22,3-2.21,3,0v36.41c0,23.34-20.8,44.69-45.57,69.46l-78.85,78.85ZM971.89,670.57c0-23.34,20.8-44.69,45.57-69.46l27.45-27.46c18.21-18.21,56.47-56.48,40.51-92.58-1.05-2.37.68-3.55,2.29-1.58,24.13,29.5,15.92,75.42-31.52,122.86l-38.83,38.75c-24.51,24.51-36.36,36.42-42.49,66.13-.46,2.22-3,2.21-3,0v-36.66ZM1197.36,671.86c0-11.19,8.09-19.29,19.29-19.29s19.29,8.09,19.29,19.29-8.09,19.29-19.29,19.29-19.29-8.09-19.29-19.29ZM1232.94,671.86c0-9.09-6.78-16.5-16.29-16.5s-16.34,6.88-16.34,16.5c0,9.09,6.83,16.5,16.34,16.5,8.99,0,16.29-6.88,16.29-16.5ZM1209.45,660.41h6.73c5.73,0,8.3,2.26,8.3,6.78,0,3.31-2,5.15-4.1,5.99l6.1,10.2h-4.52l-5.26-9.09h-3.26v9.09h-3.99v-22.97ZM1216.07,671.03c2.73,0,4.36-1.52,4.36-3.73,0-2.47-1.37-3.52-4.41-3.52h-2.58v7.25h2.63Z" />
          </svg>
          <div>
            <div className="cp-eyebrow">IASD Jardim Eulina</div>
            <h1 className="cp-title cp-display">Calendário de Pregação</h1>
            <div className="cp-subtitle">Tema, resumo e música de cada evento</div>
          </div>
        </div>
        <div>
          {currentUser ? (
            <div className="cp-userpill">
              <span style={{ fontSize: "0.8rem", color: "var(--muted)" }}>{currentUser.name.split(" ")[0]}</span>
              <button className="cp-btn cp-btn-icon" title={`Sair (${currentUser.email})`} onClick={handleLogout}><LogOut size={16} /></button>
            </div>
          ) : (
            <div ref={googleBtnRef}></div>
          )}
        </div>
      </header>

      <main className="cp-main">
        {!ready ? (
          <div className="cp-loading"><Loader2 size={18} /> Carregando calendário…</div>
        ) : (
          <>
            {currentUser && (
              <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: "1rem" }}>
                <button className="cp-btn cp-btn-gold" disabled={saving} onClick={() => openNewEntry()}>
                  <Plus size={15} /> Novo Evento
                </button>
              </div>
            )}

            {heroEntries.length > 0 ? (
              <section className="cp-hero">
                <div className="cp-eyebrow" style={{ color: "var(--ember)" }}>Próximo evento</div>
                <div className="cp-hero-weekday">{formatWeekday(heroDate)}</div>
                <div className="cp-hero-date">{formatDateLong(heroDate)}</div>
                {heroEntries.map((hero, idx) => (
                  <div key={hero.id} className="cp-hero-event">
                    {idx > 0 && <div className="cp-hero-divider" />}
                    {hero.time && <div className="cp-entry-time">{hero.time}</div>}
                    <div className="cp-entry-preacher">Ancião/ Depto responsável: {hero.preacher}</div>
                    {hero.speaker && <div className="cp-entry-speaker">Pregador(a): {hero.speaker}</div>}
                    {hero.theme && <div className="cp-entry-theme">Tema: {hero.theme}</div>}
                    {hero.summary && <p className="cp-entry-summary">{hero.summary}</p>}
                    {hero.hymnOpening && <div className="cp-tag-music"><Music2 size={14} /> Hino inicial: {hero.hymnOpening}</div>}
                    {hero.hymnClosing && <div className="cp-tag-music"><Music2 size={14} /> Hino final: {hero.hymnClosing}</div>}
                    <div style={{ display: "flex", gap: "0.5rem", marginTop: "1.1rem" }}>
                      <button className="cp-btn" style={{ borderColor: "rgba(42,35,24,0.25)", color: "var(--text)" }} onClick={() => copySummary(hero)}>
                        <Copy size={14} /> Copiar para redes sociais
                      </button>
                      {currentUser && (
                        <button className="cp-btn" style={{ borderColor: "rgba(42,35,24,0.25)", color: "var(--text)" }} onClick={() => openEditEntry(hero)}>
                          <Pencil size={14} /> Editar
                        </button>
                      )}
                    </div>
                  </div>
                ))}
              </section>
            ) : (
              <div className="cp-empty">Nenhum evento cadastrado ainda.{currentUser ? " Use “Novo Evento” para começar." : " Volte em breve."}</div>
            )}

            <section className="cp-calendar">
              <div className="cp-cal-head">
                <div className="cp-cal-month">{monthLabel}</div>
                <div className="cp-cal-nav">
                  <button className="cp-cal-today" onClick={goToday}>Hoje</button>
                  <button className="cp-cal-navbtn" onClick={() => goMonth(-1)} aria-label="Mês anterior"><ChevronLeft size={16} /></button>
                  <button className="cp-cal-navbtn" onClick={() => goMonth(1)} aria-label="Próximo mês"><ChevronRight size={16} /></button>
                </div>
              </div>
              <div className="cp-cal-grid">
                {WEEKDAY_SHORT.map((wd, i) => (
                  <div key={wd} className="cp-cal-wd" style={HIGHLIGHT_DOWS.includes(i) ? { color: dowColor(i, true) } : undefined}>{wd}</div>
                ))}
                {weeks.flat().map((cell, idx) => {
                  if (!cell) return <div key={idx} className="cp-cal-cell blank" />;
                  const dayEntries = entriesByDate[cell.iso] || [];
                  const hasEvent = dayEntries.length > 0;
                  const isHi = HIGHLIGHT_DOWS.includes(cell.dow);
                  const isToday = cell.iso === today;
                  const clickable = hasEvent || !!currentUser;
                  const cellStyle = isHi ? { background: DOW_TINT[cell.dow] } : undefined;
                  const nameStyle = { color: isHi ? dowColor(cell.dow, true) : "var(--paper)" };
                  const MAX_NAMES = 4;
                  const shown = dayEntries.slice(0, MAX_NAMES);
                  const extra = dayEntries.length - shown.length;
                  const cellTitle = hasEvent ? dayEntries.map((en) => en.theme || en.preacher).join(" · ") : undefined;
                  return (
                    <div
                      key={cell.iso}
                      className={["cp-cal-cell", isToday ? "today" : "", clickable ? "clickable" : "", hasEvent ? "has-event" : ""].join(" ")}
                      style={cellStyle}
                      onClick={clickable ? () => handleDayClick(cell.iso) : undefined}
                      title={cellTitle}
                    >
                      <span className="num">{cell.day}</span>
                      {hasEvent && (
                        <span className="name-list">
                          {shown.map((en) => <span key={en.id} className="name" style={nameStyle}>{en.preacher}</span>)}
                          {extra > 0 && <span className="name" style={nameStyle}>+{extra}</span>}
                        </span>
                      )}
                    </div>
                  );
                })}
              </div>
              <div className="cp-cal-legend">
                <span><i className="cp-legend-swatch" style={{ background: "var(--gold-soft)" }} /> Domingo</span>
                <span><i className="cp-legend-swatch" style={{ background: "var(--sage-soft)" }} /> Quarta</span>
                <span><i className="cp-legend-swatch" style={{ background: "var(--ember-soft)" }} /> Sábado</span>
              </div>
            </section>

            {thisMonthEvents.length > 0 && (
              <div className="cp-month-block">
                <button className="cp-tag-toggle" onClick={() => setShowThisMonth((v) => !v)}>
                  {showThisMonth ? <ChevronUp size={14} /> : <ChevronDown size={14} />}
                  Eventos deste mês ({thisMonthEvents.length})
                </button>
                {showThisMonth && (
                  <div style={{ marginTop: "0.9rem" }}>
                    {thisMonthEvents.map((entry) => (
                      <EntryCard key={entry.id} entry={entry} canEdit={!!currentUser} onEdit={() => openEditEntry(entry)} onCopy={() => copySummary(entry)} />
                    ))}
                  </div>
                )}
              </div>
            )}

            {futureMonthKeys.length > 0 && (
              <div className="cp-month-block">
                <button className="cp-tag-toggle" onClick={() => setShowFutureMonths((v) => !v)}>
                  {showFutureMonths ? <ChevronUp size={14} /> : <ChevronDown size={14} />}
                  Próximos meses ({futureMonthKeys.length})
                </button>
                {showFutureMonths && (
                  <>
                    <div className="cp-month-subbuttons">
                      {futureMonthKeys.map((key) => (
                        <button key={key} className={`cp-month-chip ${openMonths[key] ? "active" : ""}`} onClick={() => toggleMonth(key)}>
                          {monthLabelFor(key)} ({upcomingByMonth[key].length})
                        </button>
                      ))}
                    </div>
                    {futureMonthKeys.map((key) => openMonths[key] && (
                      <div key={key} style={{ marginTop: "0.9rem" }}>
                        {upcomingByMonth[key].map((entry) => (
                          <EntryCard key={entry.id} entry={entry} canEdit={!!currentUser} onEdit={() => openEditEntry(entry)} onCopy={() => copySummary(entry)} />
                        ))}
                      </div>
                    ))}
                  </>
                )}
              </div>
            )}
          </>
        )}
      </main>

      <footer className="cp-footer">
        <div>Igreja Adventista do Sétimo Dia Jardim Eulina</div>
        <div>Desenvolvido por Lucas Rodrigues Silva</div>
      </footer>

      {editingEntry && (
        <div className="cp-modal-backdrop" onClick={closeEntryModal}>
          <div className="cp-modal" onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <h3>{editingEntry.id ? "Editar evento" : "Novo evento"}</h3>
              <button className="cp-icon-btn" onClick={closeEntryModal}><X size={16} /></button>
            </div>
            <form onSubmit={saveEntry}>
              <div className="cp-field">
                {editingEntry.id ? (
                  <>
                    <label>Data</label>
                    <input type="date" value={editingEntry.date} onChange={(e) => setEditingEntry({ ...editingEntry, date: e.target.value })} required />
                  </>
                ) : (
                  <>
                    <div style={{ display: "flex", alignItems: "center", gap: "0.6rem" }}>
                      <label style={{ marginBottom: 0 }}>Data</label>
                      <label style={{ display: "flex", alignItems: "center", gap: "0.3rem", fontSize: "0.75rem", fontWeight: 600, color: "#5a5040", cursor: "pointer", whiteSpace: "nowrap", marginBottom: 0 }}>
                        <input type="checkbox" checked={multiMode} onChange={(e) => { setMultiMode(e.target.checked); setSaveError(""); }} />
                        Vários dias
                      </label>
                    </div>
                    {!multiMode ? (
                      <input
                        type="date" style={{ marginTop: "0.4rem" }} value={editingEntry.date}
                        onChange={(e) => { const nd = e.target.value; setEditingEntry((p) => ({ ...p, date: nd, time: p.time || defaultTimeFor(nd) })); }}
                        required
                      />
                    ) : (
                      <div style={{ marginTop: "0.5rem" }}>
                        <div className="hint" style={{ marginBottom: "0.5rem" }}>Use para semana de oração, fim de semana especial etc. O mesmo tema, resumo e hinos serão aplicados a cada data.</div>
                        <div style={{ display: "flex", gap: "0.4rem", alignItems: "flex-end", flexWrap: "wrap" }}>
                          <div style={{ flex: "1 1 100px" }}><label style={{ fontSize: "0.7rem" }}>De</label><input type="date" value={rangeStart} onChange={(e) => setRangeStart(e.target.value)} /></div>
                          <div style={{ flex: "1 1 100px" }}><label style={{ fontSize: "0.7rem" }}>Até</label><input type="date" value={rangeEnd} onChange={(e) => setRangeEnd(e.target.value)} /></div>
                          <button type="button" className="cp-btn" style={{ borderColor: "rgba(42,35,24,0.25)", color: "var(--text)", padding: "0.55rem 0.8rem" }} onClick={addRangeDates}>Adicionar intervalo</button>
                        </div>
                        <div style={{ display: "flex", gap: "0.4rem", alignItems: "flex-end", marginTop: "0.6rem" }}>
                          <div style={{ flex: 1 }}><label style={{ fontSize: "0.7rem" }}>Adicionar data avulsa</label><input type="date" value={dateInput} onChange={(e) => setDateInput(e.target.value)} /></div>
                          <button type="button" className="cp-btn" style={{ borderColor: "rgba(42,35,24,0.25)", color: "var(--text)", padding: "0.55rem 0.8rem" }} onClick={addSingleMultiDate}><Plus size={14} /> Adicionar</button>
                        </div>
                        {multiDates.length > 0 && (
                          <div style={{ display: "flex", flexWrap: "wrap", gap: "0.4rem", marginTop: "0.75rem" }}>
                            {multiDates.map((d) => (
                              <span key={d} className="cp-date-chip">
                                {WEEKDAY_SHORT[new Date(d + "T12:00:00").getDay()]} {formatDateShort(d).day}/{formatDateShort(d).month}
                                <button type="button" onClick={() => removeMultiDate(d)}><X size={12} /></button>
                              </span>
                            ))}
                          </div>
                        )}
                      </div>
                    )}
                  </>
                )}
              </div>
              <div className="cp-field">
                <label>Horário</label>
                <input type="time" value={editingEntry.time || ""} onChange={(e) => setEditingEntry({ ...editingEntry, time: e.target.value })} />
                <div className="hint">Usado para ordenar os eventos quando há mais de um no mesmo dia.</div>
              </div>
              <div className="cp-field">
                <label>Ancião/ Depto responsável</label>
                <input type="text" value={editingEntry.preacher} onChange={(e) => setEditingEntry({ ...editingEntry, preacher: e.target.value })} placeholder="Ex.: Ancião João, Departamento de Jovens" required />
              </div>
              <div className="cp-field">
                <label>Nome do pregador(a)</label>
                <input type="text" value={editingEntry.speaker || ""} onChange={(e) => setEditingEntry({ ...editingEntry, speaker: e.target.value })} placeholder="Nome de quem vai pregar" />
              </div>
              <div className="cp-field">
                <label>Tema do evento</label>
                <input type="text" value={editingEntry.theme} onChange={(e) => setEditingEntry({ ...editingEntry, theme: e.target.value })} placeholder="Ex.: A Esperança que Não Falha" />
              </div>
              <div className="cp-field">
                <label>Resumo para redes sociais</label>
                <textarea rows={7} maxLength={2500} value={editingEntry.summary} onChange={(e) => setEditingEntry({ ...editingEntry, summary: e.target.value })} placeholder="Um resumo curto para usar no post do Instagram/WhatsApp" />
                <div className="hint">{editingEntry.summary.length}/2500 caracteres</div>
              </div>
              <div className="cp-field">
                <label>Hino inicial</label>
                <input type="text" value={editingEntry.hymnOpening || ""} onChange={(e) => setEditingEntry({ ...editingEntry, hymnOpening: e.target.value })} placeholder="Nome ou número do hino de abertura" />
              </div>
              <div className="cp-field">
                <label>Hino final</label>
                <input type="text" value={editingEntry.hymnClosing || ""} onChange={(e) => setEditingEntry({ ...editingEntry, hymnClosing: e.target.value })} placeholder="Nome ou número do hino de encerramento" />
              </div>
              {saveError && <div className="cp-error">{saveError}</div>}
              <div className="cp-modal-actions">
                {editingEntry.id && (
                  <button type="button" className="cp-btn" style={{ borderColor: "rgba(42,35,24,0.25)", color: "var(--ember)" }} onClick={() => { const id = editingEntry.id; closeEntryModal(); deleteEntry(id); }}>
                    <Trash2 size={14} /> Remover
                  </button>
                )}
                <button type="submit" className="cp-btn cp-btn-gold" disabled={saving}><Check size={15} /> {saving ? "Salvando…" : "Salvar"}</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {viewingEntry && (
        <div className="cp-modal-backdrop" onClick={() => setViewingEntry(null)}>
          <div className="cp-modal" onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <h3>{formatWeekday(viewingEntry.date)}</h3>
              <button className="cp-icon-btn" onClick={() => setViewingEntry(null)}><X size={16} /></button>
            </div>
            <div className="cp-subtitle" style={{ color: "#8a8068", marginTop: "-0.2rem" }}>{formatDateLong(viewingEntry.date)}</div>
            {viewingEntry.time && <div className="cp-entry-time" style={{ marginTop: "0.7rem" }}>{viewingEntry.time}</div>}
            <div className="cp-entry-preacher" style={{ marginTop: "0.5rem" }}>Ancião/ Depto responsável: {viewingEntry.preacher}</div>
            {viewingEntry.speaker && <div className="cp-entry-speaker">Pregador(a): {viewingEntry.speaker}</div>}
            {viewingEntry.theme && <div className="cp-entry-theme">Tema: {viewingEntry.theme}</div>}
            {viewingEntry.summary && <p className="cp-entry-summary">{viewingEntry.summary}</p>}
            {viewingEntry.hymnOpening && <div className="cp-tag-music"><Music2 size={14} /> Hino inicial: {viewingEntry.hymnOpening}</div>}
            {viewingEntry.hymnClosing && <div className="cp-tag-music"><Music2 size={14} /> Hino final: {viewingEntry.hymnClosing}</div>}
            <div className="cp-modal-actions">
              <button className="cp-btn cp-btn-gold" onClick={() => copySummary(viewingEntry)}><Copy size={14} /> Copiar para redes sociais</button>
            </div>
          </div>
        </div>
      )}

      {dayView && (
        <div className="cp-modal-backdrop" onClick={() => setDayView(null)}>
          <div className="cp-modal" onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <h3>{formatWeekday(dayView)}</h3>
              <button className="cp-icon-btn" onClick={() => setDayView(null)}><X size={16} /></button>
            </div>
            <div className="cp-subtitle" style={{ color: "#8a8068", marginTop: "-0.2rem" }}>{formatDateLong(dayView)}</div>
            <div style={{ marginTop: "1rem" }}>
              {(entriesByDate[dayView] || []).map((entry) => (
                <div key={entry.id} className="cp-dayview-item">
                  {entry.time && <div className="cp-entry-time" style={{ marginBottom: "0.35rem" }}>{entry.time}</div>}
                  <div className="cp-entry-preacher">Ancião/ Depto responsável: {entry.preacher || "A definir"}</div>
                  {entry.speaker && <div className="cp-entry-speaker">Pregador(a): {entry.speaker}</div>}
                  <div className="cp-entry-theme" style={{ fontSize: "1rem" }}>Tema: {entry.theme || "a definir"}</div>
                  <div style={{ display: "flex", gap: "0.4rem", marginTop: "0.55rem" }}>
                    <button className="cp-btn" style={{ borderColor: "rgba(42,35,24,0.25)", color: "var(--text)", padding: "0.4rem 0.75rem", fontSize: "0.78rem" }} onClick={() => copySummary(entry)}>
                      <Copy size={13} /> Copiar
                    </button>
                    <button
                      className="cp-btn"
                      style={{ borderColor: "rgba(42,35,24,0.25)", color: "var(--text)", padding: "0.4rem 0.75rem", fontSize: "0.78rem" }}
                      onClick={() => { setDayView(null); currentUser ? openEditEntry(entry) : setViewingEntry(entry); }}
                    >
                      {currentUser ? <Pencil size={13} /> : null} {currentUser ? "Editar" : "Ver mais"}
                    </button>
                  </div>
                </div>
              ))}
            </div>
            {currentUser && (
              <button className="cp-btn cp-btn-gold" style={{ width: "100%", justifyContent: "center", marginTop: "1rem" }} onClick={() => { const d = dayView; setDayView(null); openNewEntry(d); }}>
                <Plus size={15} /> Adicionar outro evento
              </button>
            )}
          </div>
        </div>
      )}

      {toast && <div className="cp-toast"><Check size={14} /> {toast}</div>}
    </div>
  );
}

function EntryCard({ entry, canEdit, onEdit, onCopy }) {
  const { day, month, dow } = formatDateShort(entry.date);
  const accent = dowColor(dow, false);
  return (
    <div className="cp-card" style={{ "--card-accent": accent }}>
      <div className="cp-row">
        <div className="cp-datebox">
          <div className="wd" style={{ color: accent }}>{WEEKDAY_SHORT[dow]}</div>
          <div className="n">{day}</div>
          <div className="m">{month}</div>
          {entry.time && <div className="t">{entry.time}</div>}
        </div>
        <div style={{ flex: 1 }}>
          <div className="cp-entry-preacher">Ancião/ Depto responsável: {entry.preacher || "A definir"}</div>
          {entry.speaker && <div className="cp-entry-speaker">Pregador(a): {entry.speaker}</div>}
          <div className="cp-entry-theme">Tema: {entry.theme || "a definir"}</div>
          {entry.summary && <p className="cp-entry-summary">{entry.summary}</p>}
          {entry.hymnOpening && <div className="cp-tag-music"><Music2 size={13} /> Hino inicial: {entry.hymnOpening}</div>}
          {entry.hymnClosing && <div className="cp-tag-music"><Music2 size={13} /> Hino final: {entry.hymnClosing}</div>}
        </div>
        <div style={{ display: "flex", gap: "0.35rem" }}>
          <button className="cp-icon-btn" onClick={onCopy} title="Copiar para redes sociais"><Copy size={14} /></button>
          {canEdit && <button className="cp-icon-btn" onClick={onEdit} title="Editar"><Pencil size={14} /></button>}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
